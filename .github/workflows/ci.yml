name: CI

# Runs the full test suite on every push and PR. Until this existed, 111 green tests
# across three suites ran only when someone remembered to run them locally — and
# DECISIONS.md D37 already claimed "drift fails CI", which was not true of anything.
#
# STATUS: every step below was verified LOCALLY, including that each gate actually goes
# RED — a broken assertion fails `npm test` (exit 1), a type error fails `npm run
# typecheck` (exit 2) and `functions run build` (exit 1). What has NOT happened yet is a
# real run on GitHub Actions: this file has never executed on a runner. Watch the first
# push, since runner-only differences (emulator jar download, Java setup, npm cache
# behaviour across three lockfiles) can only surface there.
on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Client + functions. These need no emulator, so they stay fast and always-required.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20: functions/package.json pins engines.node "20" and firebase.json pins
      # the nodejs20 runtime. Local dev happens to be on 22, but 20 is what deploys.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # This repo is THREE independent npm projects, not a workspace — root,
          # functions/ and firestore-tests/ each have their own lockfile + node_modules.
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            firestore-tests/package-lock.json

      - name: Install (root)
        run: npm ci
      - name: Install (functions)
        run: npm ci --prefix functions

      # Deliberately separate steps rather than the existing `test:all` script: that
      # chains with && and short-circuits, so the first failure would hide the rest.
      - name: Typecheck (root)
        run: npm run typecheck

      # Root lint (eslint.config.js, flat config, ESLint 9). Excluded until 2026-08-11,
      # when the script still exited 127 with no eslint dependency and no config.
      # Runs with --max-warnings 0: the codebase is at zero findings, so warnings are held
      # there rather than allowed to accumulate. Verified to go RED on one new warning
      # before being trusted.
      - name: Lint (client)
        run: npm run lint

      - name: Unit tests (client)
        run: npm test

      - name: Lint (functions)
        run: npm --prefix functions run lint

      - name: Build (functions)
        run: npm --prefix functions run build

      - name: Unit tests (functions)
        run: npm run test:functions

      - name: Build (app)
        run: npm run build

      - name: Build (landing)
        run: npm run build:landing

  # Security-rules tests run against the real Firestore emulator, which needs Java and
  # downloads emulator jars — slower and more prone to flake than the pure unit tests,
  # so it gets its own job. It is NOT continue-on-error: these rules are the primary
  # authorization boundary, and a silently-skipped rules suite is how that rots.
  rules-tests:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firestore-tests/package-lock.json

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install (firestore-tests)
        run: npm ci --prefix firestore-tests

      # The firestore-tests script starts the emulator itself via `firebase
      # emulators:exec` and runs fully offline — the --project it names is only a
      # label for the emulator, so no Firebase credentials are needed here.
      - name: Rules tests
        run: npm run test:rules
